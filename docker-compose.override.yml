services:
  catalog.api:
    container_name: catalog.api
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
      - ASPNETCORE_HTTPS_PORTS=8081
      - ConnectionStrings__Postgres=Server=catalogdb;Port=5432;Database=CatalogDb;User Id=postgres;Password=postgres;
      - ConnectionStrings__ElasticSearch=http://elasticsearch:9200
    ports:
      - "6000:8080"
      - "6060:8081"
    volumes:
      - ${APPDATA}/Microsoft/UserSecrets:/home/app/.microsoft/usersecrets:ro
      - ${APPDATA}/ASP.NET/Https:/home/app/.aspnet/https:ro
    depends_on:
        - catalogdb
        - elasticsearch

  basket.api:
    container_name: basket.api
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
      - ASPNETCORE_HTTPS_PORTS=8081
      - ConnectionStrings__Postgres=Server=basketdb;Port=5432;Database=BasketDb;User Id=postgres;Password=postgres;
      - ConnectionStrings__ElasticSearch=http://elasticsearch:9200
      - ConnectionStrings__Redis=distributedcache:6379
      - Grpc__DiscountUrl=https://discount.grpc:8081
    ports:
      - "6001:8080"
      - "6061:8081"
    volumes:
      - ${APPDATA}/Microsoft/UserSecrets:/home/app/.microsoft/usersecrets:ro
      - ${APPDATA}/ASP.NET/Https:/home/app/.aspnet/https:ro
    depends_on:
        - discount.grpc
        - basketdb
        - elasticsearch
        - distributedcache

  discount.grpc:
    container_name: discount.grpc
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
      - ASPNETCORE_HTTPS_PORTS=8081
      - ConnectionStrings__ElasticSearch=http://elasticsearch:9200
    ports:
      - "6002:8080"
      - "6062:8081"
    volumes:
      - ${APPDATA}/Microsoft/UserSecrets:/home/app/.microsoft/usersecrets:ro
      - ${APPDATA}/ASP.NET/Https:/home/app/.aspnet/https:ro
    depends_on:
      - elasticsearch

  ordering.api:
    container_name: ordering.api
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
      - ASPNETCORE_HTTPS_PORTS=8081
      - ConnectionStrings__ElasticSearch=http://elasticsearch:9200
    ports:
      - "6003:8080"
      - "6063:8081"
    volumes:
      - ${APPDATA}/Microsoft/UserSecrets:/home/app/.microsoft/usersecrets:ro
      - ${APPDATA}/ASP.NET/Https:/home/app/.aspnet/https:ro
    depends_on:
      - elasticsearch

  healthcheck.web:
    container_name: healthcheck.web
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
      - ASPNETCORE_HTTPS_PORTS=8081
      - HealthChecksUI__HealthChecks__0__Name=Catalog.API
      - HealthChecksUI__HealthChecks__0__Uri=http://catalog.api:8080/health
      - HealthChecksUI__HealthChecks__1__Name=Basket.API
      - HealthChecksUI__HealthChecks__1__Uri=http://basket.api:8080/health
      - HealthChecksUI__HealthChecks__2__Name=Discount.Grpc
      - HealthChecksUI__HealthChecks__2__Uri=http://discount.grpc:8080/health
      - HealthChecksUI__HealthChecks__3__Name=Ordering.API
      - HealthChecksUI__HealthChecks__3__Uri=http://ordering.api:8080/health
    ports:
      - "6004:8080"
      - "6064:8081"
    volumes:
      - ${APPDATA}/Microsoft/UserSecrets:/home/app/.microsoft/usersecrets:ro
      - ${APPDATA}/ASP.NET/Https:/home/app/.aspnet/https:ro
    depends_on:
     - catalog.api
     - basket.api
     - discount.grpc
     - ordering.api
 
  catalogdb:
   container_name: catalogdb
   environment:
    - POSTGRES_USER=postgres
    - POSTGRES_PASSWORD=postgres
    - POSTGRES_DB=CatalogDb
   restart: always
   ports:
    - "65432:5432" 
   volumes:
   - postgres_catalog:/var/lib/postgresql/data/

  basketdb:
   container_name: basketdb
   environment:
    - POSTGRES_USER=postgres
    - POSTGRES_PASSWORD=postgres
    - POSTGRES_DB=BasketDb
   restart: always
   ports:
    - "65433:5432" 
   volumes:
   - postgres_basket:/var/lib/postgresql/data/

  distributedcache:
    container_name: distributedcache
    restart: always
    ports:
      - "63779:6379"

  elasticsearch:
    container_name: elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
    ports:
      - "9200:9200"
    volumes:
      - elastic_search_data:/usr/share/elasticsearch/data

  kibana:
    container_name: kibana
    ports:
      - "5601:5601"